name: Update GitHub Data
# Decommissioned 2026-07-28: superseded by the D1-backed Cloudflare Worker
# (https://github.com/runsascoded/watchy, cfw/). Manual dispatch still works,
# but requires the WATCHY_TOKEN secret (deleted at decommission) to be re-set.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install watchy==0.0.7
    - name: Collect data
      env:
        # PAT (not the Actions token): as of 2026-06-30, /repos/{owner}/{repo}/stargazers
        # is restricted to admins/collaborators, and the per-run GITHUB_TOKEN qualifies
        # for no repo but this one. https://github.blog/changelog/2026-06-30-upcoming-access-restrictions-to-public-api-endpoints-and-ui-views/
        GITHUB_TOKEN: ${{ secrets.WATCHY_TOKEN }}
        WATCHY_DIR: .  # Write to current directory instead of .watchy
      run: |
        watchy stars runsascoded ryan-williams hudcostreets bikejc embankmentjc neighbor-ryan Open-Athena
        watchy follows runsascoded ryan-williams hudcostreets bikejc embankmentjc neighbor-ryan Open-Athena
    - name: Commit and push changes
      run: |
        git config --local user.email "ryan-williams@users.noreply.github.com"
        git config --local user.name "Ryan Williams"
        git add .
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          watchy commit
          git push
        fi
